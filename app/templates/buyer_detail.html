{% include 'hr_header.html' %}
<style>
table {
	font-family: times new roman;
	border-collapse: collapse;
	width: 100%;
}
td, th{
	border: 1px solid #dddddd;
	text-align: center;
	padding: 8px;
	}
</style>

 <div class="container" style="margin:0 auto;">
 	<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12" style="padding-top: 100px;">
    <div class="card" >
        <h5 class="card-header">Work Details</h5>
        <div class="card-body">
            <div class="table-responsive ">
                <table class="table table-bordered">
                    <thead style="background: #ff407b;color: #FFF">
                        <tr class="white">
	                        <th>S.No</th>
							<th>Order Id</th>
                            <th>Buyer Name</th>
                            <th>Item Name</th>
                            <th>Delivery Date</th>
                            <th>Quantity</th>
							<th>Sample</th>
                            <th>Option</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for i in detail %}
                        <tr>
					        <td>{{forloop.counter}}</td>
							<td>{{i.order_id}}</td>

                            <td style="text-transform: capitalize;">{{i.buyer_name}}</td>
                            <td>{{i.order_item}}</td>
                            <td>{{i.delivery_date}}</td>
                            <td>{{i.quantity}}</td>
							<td><a href="/media/{{i.image}}" target="_blank"><img src="/media/{{i.image}}" width="50px" height="50px"></a></td>
                            <td><a href="{% url 'work_details' pk=i.id %}" class="btn btn-info"><i class="fa fa-eye"></i></a></td>
                           
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="8" class="text-center bg-primary">No Work</td>
                        </tr>
                       {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
