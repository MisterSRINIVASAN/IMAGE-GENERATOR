{% include 'hr_header.html' %}
<div class="col-xl-9 col-lg-9 col-md-12 col-sm-12 col-12">
    <div class="card">
        <h5 class="card-header">Add Expense</h5>
        <div class="card-body">
            {% if messages %}
                {% for i in messages %}
                    <div class="alert alert-success">{{i}}</div>
                {% endfor %}
            {% endif %}
            <form  id="basicform" method="post" enctype="multipart/form-data">{% csrf_token %}
                <div class="form-group">
                    <label for="expense_name">Expense Name</label>
                    <input id="inputUserName" type="text" name="expense_name" required="required"  class="form-control">
                </div>
                <div class="form-group">
                    <label for="expense_purpose">Expense Purpose</label>
                    <input id="inputUserName" type="text" name="expense_purpose" required="required"  class="form-control">
                </div>
                <div class="form-group">
                    <label for="inputUserName">Expense Amount</label>
                    <input id="inputUserName" type="text" name="expense_amount" required="required"  class="form-control">
                </div>
                 <div class="form-group">
                    <label for="inputUserName">Expense File</label>
                    <input id="inputUserName" type="file" name="expense_file" required="required"  class="form-control">
                </div>
                <div class="col-sm-6 pl-0">
                    <p class="text-right">
                        <button type="submit" class="btn btn-space btn-primary">Add Expense  </button>
                        <button type="reset" class="btn btn-space btn-secondary">Cancel</button>
                    </p>
                </div>
                
            </form>
        </div>
    </div>
</div>
{% include 'footer.html' %}
