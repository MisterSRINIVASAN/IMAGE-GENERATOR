{% include 'user_header.html' %}
<style>
table {
	font-family: times new roman;
	border-collapse: collapse;
	width: 100%;
}
td, th{
	border: 1px solid #dddddd;
	text-align: center;
	padding: 8px;
	}
</style>
 <div class="container" style="margin:0 auto;">
 	<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12" style="padding-top: 100px;">
    <div class="card" >
        <h5 class="card-header">Job Details</h5>
        <div class="card-body">
            <div class="row">
                {% for i in detail %}
                <div class="col-md-6">
                    <h3>Company Name: {{i.company_name}}</h3>
                    <h3>Job Title:{{i.job_title}}</h3>
                    <p>Job Description : {{i.description}}</p>
                    <h3>Position: {{i.position}}</h3>
                </div>
                <div class="col-md-6">
                    <h3>Experience: {{i.experience}}</h3>
                    <h3>Salary:{{i.salary}}</h3>
                    <p>Job Type : {{i.area_of_work}}</p>
                    <a href="{% url 'apply' pk=i.id %}" class="btn btn-success">Apply Now</a>
                </div>
                
                {% endfor %}
                
            </div>
        </div>
    </div>
</div>


</from>
