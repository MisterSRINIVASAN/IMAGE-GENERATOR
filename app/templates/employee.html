{% include 'hr_header.html' %}
<style>
table {
	font-family: times new roman;
	border-collapse: collapse;
	width: 100%;
}
td, th{
	border: 1px solid #dddddd;
	text-align: center;
	padding: 8px;
	}
</style>

 <div class="container" style="margin:0 auto;">
 	<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12" style="padding-top: 100px;">
    <div class="card" >
        <h5 class="card-header">Employee Details</h5>
        <div class="card-body">
            <div class="table-responsive ">
                <table class="table table-bordered">
                    <thead style="background: #ff407b;color: #FFF">
                        <tr class="white">
	                        <th>S.No</th>
							<th>E Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
							<th>DOB</th>
							<th>DOJ</th>
                            <th>Salary/Day</th>
                            <th>Bio Data</th>
                            <th>City</th>
                            <th>Option</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for i in detail %}
                        <tr>
					        <td>{{forloop.counter}}</td>
							<td>{{i.employee_name}}</td>
                            <td>{{i.email}}</td>
                            <td>{{i.mobile}}</td>
							<td>{{i.dob}}</td>
                            <td>{{i.doj}}</td>
                            <td>{{i.per_day}}</td>
                            <td><a href="/media/{{i.bio_data}}" target="_blank" class="btn btn-warning"><i class="fa fa-download"></i></a>
                            <td>{{i.city}}</td>
							<td><a href="{% url 'edit_employee' pk=i.id %}" class="btn btn-primary btn-xs">Edit</a>
                                <a href="{% url 'delete' pk=i.id %}" class="btn btn-secondary btn-xs">Delete</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="8" class="text-center bg-primary">No Employee</td>
                        </tr>
                       {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
