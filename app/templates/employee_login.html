{% include 'header.html' %}

  <div class="container" style="width: 60% !important;">
    <div class="card card-register mx-auto mt-5">
      <div class="card-header">Employee Login Here</div>
      <div class="card-body">
         {% if messages %}
          {% for i in messages %}
            <div class="alert alert-danger">{{i}}</div>
          {% endfor %}
        {% endif %}
        <form method="post" action="{% url 'employee_login' %}">{% csrf_token %}
          <div class="form-group">
            <div class="form-row">
              <div class="col-md-6">
                <div class="">
                  <input type="text" name="uname" class="form-control" placeholder="Username" required="required" autofocus="autofocus">
                </div>
              </div>
              <div class="col-md-6">
                <div class="">
                  <input type="password" name="psw" class="form-control" placeholder="Password" required="required">
                </div>
              </div>
              <div class="col-md-12">
                <label>Department</label>
                <div class="">
                   <select required="required"  class="form-control" name="department">
                        <option value="">Select</option>
                        <option value="Knitting">Knitting</option>
                        <option value="Dying">Dying</option>
                        <option value="Cutting">Cutting and Stitching</option>
                        <option value="Printing">Printing</option>
                        <option value="Ironing">Quality Checking and Packing</option>
                        <option value="Checking">Checking and Approval</option>
                    </select>
                </div>
              </div>
            </div>
          </div>
          <input type="submit" class="btn btn-primary btn-block" value="Employee Login">

        </form>
      </div>
    </div>
  </div>
</body>
